name: Validate PersonalStyling Skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill and references
        run: python -m unittest discover -s tests -v
      - name: Search curated outfit database
        run: |
          python scripts/search_looks.py "格纹" --kind creator_outfit --json > /tmp/look-results.json
          python -c "import json; v=json.load(open('/tmp/look-results.json')); assert v and all(x['kind']=='creator_outfit' for x in v); print(len(v), 'verified indexed records found')"
      - name: Build WorkBuddy package
        run: python scripts/package_skill.py
      - name: Check ZIP layout
        run: python -c "from zipfile import ZipFile; z=ZipFile('dist/personal-styling.zip'); assert 'personal-styling/SKILL.md' in z.namelist(); print('zip structure OK')"
      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalStyling-Skill
          path: dist/personal-styling.zip
          retention-days: 90
